name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      # Keep aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    env:
      HAS_REGISTRY_READ_TOKEN: ${{ secrets.CLI_TOOL_REGISTRY_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out CliToolRegistry
        if: ${{ env.HAS_REGISTRY_READ_TOKEN == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: In-Pro-Org/CliToolRegistry
          ref: develop
          path: registry-source
          token: ${{ secrets.CLI_TOOL_REGISTRY_READ_TOKEN }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:model
      - run: npm run validate:explorers
      - run: npm run build
        env:
          CLI_TOOL_REGISTRY_PATH: ${{ github.workspace }}/registry-source
          CLI_TOOL_REGISTRY_REF: develop
      # build syncs the develop catalog; validate its full logo ID inventory afterward.
      - run: npm run validate:logos
      - run: npm run test:production
      - run: npm run test:logos
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          # GitHub Pages enforces a ten-minute deployment timeout.
          timeout: 600000

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_REGISTRY_READ_TOKEN: ${{ secrets.CLI_TOOL_REGISTRY_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out CliToolRegistry
        if: ${{ env.HAS_REGISTRY_READ_TOKEN == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: In-Pro-Org/CliToolRegistry
          ref: main
          path: registry-source
          token: ${{ secrets.CLI_TOOL_REGISTRY_READ_TOKEN }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLI_TOOL_REGISTRY_PATH: ${{ github.workspace }}/registry-source
          CLI_TOOL_REGISTRY_REF: main
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

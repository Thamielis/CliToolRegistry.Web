<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('cli-tool-registry.theme');
          if (['dark', 'light', 'system'].includes(saved)) theme = saved;
        } catch {}
        const resolved = theme === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : theme;
        document.documentElement.dataset.theme = resolved;
        document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#08090d' : '#faf8f6';
      })();
    </script>
    <meta name="description" content="CliToolRegistry-Katalog mit Werkzeugen, Installationsbefehlen und Plattformen." />
    <title>CLI Tool Registry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
